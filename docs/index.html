<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟修仙2 - 数值资料库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <div class="sidebar-header">
            <h1>修仙资料库</h1>
            <p class="subtitle">模拟修仙2 插件数据</p>
        </div>
        <ul class="nav-list">
            <li><a href="#overview" class="nav-link active" data-page="overview">
                <span class="nav-icon">&#9670;</span>总览</a></li>
            <li><a href="#levels" class="nav-link" data-page="levels">
                <span class="nav-icon">&#9650;</span>境界</a></li>
            <li><a href="#pills" class="nav-link" data-page="pills">
                <span class="nav-icon">&#9679;</span>丹药</a></li>
            <li><a href="#equipment" class="nav-link" data-page="equipment">
                <span class="nav-icon">&#9876;</span>装备</a></li>
            <li><a href="#alchemy" class="nav-link" data-page="alchemy">
                <span class="nav-icon">&#9737;</span>炼丹</a></li>
            <li><a href="#adventure" class="nav-link" data-page="adventure">
                <span class="nav-icon">&#10070;</span>冒险</a></li>
            <li><a href="#system" class="nav-link" data-page="system">
                <span class="nav-icon">&#9881;</span>系统</a></li>
        </ul>
        <div class="sidebar-footer">
            <input type="text" id="global-search" placeholder="搜索丹药、武器、心法...">
        </div>
    </nav>

    <main id="content">
        <div id="page-overview" class="page active"></div>
        <div id="page-levels" class="page"></div>
        <div id="page-pills" class="page"></div>
        <div id="page-equipment" class="page"></div>
        <div id="page-alchemy" class="page"></div>
        <div id="page-adventure" class="page"></div>
        <div id="page-system" class="page"></div>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>加载数据中...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
