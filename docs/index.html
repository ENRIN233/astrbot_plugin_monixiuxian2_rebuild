<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟修仙2 - 数值资料库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-js" style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1;"></div>

    <nav id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">仙</div>
            <h1>修仙资料库</h1>
            <p class="subtitle">模拟修仙2 · v4.0.2</p>
        </div>
        <ul class="nav-list">
            <li><a href="#overview" class="nav-link active" data-page="overview"><span class="nav-icon">◈</span>总览</a></li>
            <li><a href="#levels" class="nav-link" data-page="levels"><span class="nav-icon">▲</span>境界</a></li>
            <li><a href="#pills" class="nav-link" data-page="pills"><span class="nav-icon">●</span>丹药</a></li>
            <li><a href="#equipment" class="nav-link" data-page="equipment"><span class="nav-icon">⚔</span>装备</a></li>
            <li><a href="#combat" class="nav-link" data-page="combat"><span class="nav-icon">✦</span>战斗</a></li>
            <li><a href="#systems" class="nav-link" data-page="systems"><span class="nav-icon">⚙</span>游戏系统</a></li>
            <li><a href="#commands" class="nav-link" data-page="commands"><span class="nav-icon">⌘</span>指令大全</a></li>
            <li><a href="#alchemy" class="nav-link" data-page="alchemy"><span class="nav-icon">☀</span>炼丹</a></li>
            <li><a href="#adventure" class="nav-link" data-page="adventure"><span class="nav-icon">❧</span>冒险</a></li>
            <li><a href="#skills" class="nav-link" data-page="skills"><span class="nav-icon">✦</span>神通</a></li>
            <li><a href="#roots" class="nav-link" data-page="roots"><span class="nav-icon">☯</span>灵根</a></li>
        </ul>
        <div class="sidebar-footer">
            <input type="text" id="global-search" placeholder="搜索丹药、武器、心法...">
        </div>
    </nav>

    <main id="content">
        <div id="page-overview" class="page active"></div>
        <div id="page-levels" class="page"></div>
        <div id="page-pills" class="page"></div>
        <div id="page-equipment" class="page"></div>
        <div id="page-combat" class="page"></div>
        <div id="page-systems" class="page"></div>
        <div id="page-commands" class="page"></div>
        <div id="page-alchemy" class="page"></div>
        <div id="page-adventure" class="page"></div>
        <div id="page-skills" class="page"></div>
        <div id="page-roots" class="page"></div>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>加载数据中...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 40, density: { enable: true, value_area: 900 } },
                        color: { value: '#ffffff' },
                        shape: { type: 'circle' },
                        opacity: { value: 0.12, random: true, anim: { enable: true, speed: 0.3, opacity_min: 0.05, sync: false } },
                        size: { value: 2, random: true, anim: { enable: false } },
                        line_linked: { enable: false },
                        move: { enable: true, speed: 0.5, direction: 'top', random: true, straight: false, out_mode: 'out', bounce: false }
                    },
                    interactivity: { detect_on: 'canvas', events: { onhover: { enable: false }, onclick: { enable: false }, resize: true } },
                    retina_detect: true
                });
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
